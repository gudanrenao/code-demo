server:
  address: ":8080"
  upload_dir: "./uploads"
  frame_dir: "./frames"

mysql:
  dsn: "root:root@tcp(localhost:3306)/videodetection?parseTime=true&loc=Local"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 3600

detection:
  supported_video_formats:
    - mp4
    - mov
    - flv
    - avi
    - wmv
    - rmvb
    - ts
    - 3gp
  max_file_size: 500 # MB
  default_threshold: 0.5
  max_frames: 1000 